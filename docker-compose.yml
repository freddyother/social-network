services:
  postgres:
    image: postgres:17-alpine
    container_name: social-network-postgres
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - social_network_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_network"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: social-network-backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/social_network?sslmode=disable
      MIGRATIONS_DIR: /app/pkg/db/migrations/postgres
      UPLOADS_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:8080
      FRONTEND_BASE_URL: http://localhost:4173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Accept,Authorization,Content-Type,X-Requested-With
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
        VITE_APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-http://localhost:4173}
    container_name: social-network-frontend
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  social_network_pg_data:
  backend_uploads:
